        max-width: 1112px;
        min-height: 68px;
        margin: auto;
        padding: 0 clamp(18px, 5vw, 52px);
      }
      .film-head-source,
      .film-action {
        display: inline-flex;

        font-weight: 650;
      }
      .film-head-source { font-size: 14px; }
      .film-head-source:hover,
      .film-download:hover { text-decoration: underline; text-underline-offset: 4px; }
      .film-main {
        max-width: 1112px;
        min-height: auto;
        margin: auto;
        padding: clamp(23px, 4vw, 42px) clamp(18px, 5vw, 52px) 48px;
      }
      .film-heading {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 650;
        color: var(--muted);
      }
      .film-heading::before { content: ""; width: 24px; height: 2px; background: #a67826; }
      .film-main h1 {
        margin: 5px 0;
        font: 700 clamp(31px, 4.2vw, 48px)/1.22 var(--serif);
        letter-spacing: .045em;
      }
      .film-lede { color: var(--muted); line-height: 1.65; }
      .film-player {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        margin-top: 12px;
        border-radius: 8px;
        background: #142941;
        box-shadow: 0 6px 24px #14294117;
      }
      .film-player:focus-visible { outline: 3px solid #1789bf; outline-offset: 4px; }
      .film-hint { margin-top: 10px; color: var(--muted); }
      .film-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px; margin-top: 18px; }
      .film-primary { gap: 14px; padding: 0 17px; border-radius: 5px; color: #fff; background: #204460; }
      .film-primary:hover { background: #2d5875; }
      .film-download { gap: 6px; }
      .film-download span { font: 11px/1 var(--mono); color: var(--muted); }
      .film-sources { margin-top: 34px; padding-top: 20px; border-top: 1px solid #ccdbe3; scroll-margin-top: 20px; }
      .film-sources h2 { margin: 0 0 12px; font: 700 20px/1.5 var(--serif); }
      .film-sources ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 10px 18px; }
      .film-sources li { display: grid; grid-template-columns: 48px 1fr; align-items: center; column-gap: 8px; }
      .film-sources li img { width: 46px; height: 46px; grid-row: span 2; }
      .film-sources li b { align-self: end; font-size: 15px; }
      .film-sources li span { align-self: start; font-size: 13px; }
      .film-sources li a + a { margin-left: 12px; }
      .film-sources a { color: var(--blue); text-underline-offset: .2em; text-decoration: underline; }
      .film-sources p { margin: 12px 0 0; line-height: 1.7; font-size: 14px; color: var(--muted); }
      @media(max-width: 440px) { .film-sources ul { grid-template-columns: repeat(2,minmax(0,1fr)); } }
      @media (max-width: 470px) {
        .film-head-inner { min-height: 58px; }
        .film-tools { gap: 5px 16px; }
        .film-main { padding-bottom: 28px; }
      }

      .scene-index { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
      .scene-index button { background:#f4f8f6; color:#1d4353; border:1px solid #c2d2d0; border-radius:4px; display:grid; text-align:left; padding:10px; gap:4px; }
      .scene-index button:hover { background:#e4efed; border-color:#49818a; }
      .scene-index small { font:600 12px/1.4 var(--mono);color:#4d6b73; }
      .scene-index span { font-size:12px; }
      @media(max-width:410px) { .scene-index {grid-template-columns:repeat(2,minmax(0,1fr));} }
    </style>

    <script>
      if (location.protocol === "https:" || location.protocol === "http:") {
        document.getElementById("film-credit-notes").href =
          "https://github.com/Juvenile-A3/stella-sora-story-guide/blob/main/media/素材来源.md";
      }
      const player = document.getElementById("film-player");
      document.querySelector(".scene-index").addEventListener("click", (event) => {
        const cue = event.target.closest("[data-seek]");
        if (!cue) return;
        const seek = () => { player.currentTime = Math.min(Number(cue.dataset.seek),player.duration); };
        if (player.readyState >= 1) seek();
        else player.addEventListener("loadedmetadata",seek,{once:true});
        player.scrollIntoView({block:"center"});
        player.play().catch(() => { player.focus(); });
      });
      player.addEventListener("error", () => {
        document.getElementById("film-error").hidden = false;
      });
    </script>
